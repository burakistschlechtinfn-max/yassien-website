<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mein Spiel</title>
  <style>
    .iframe-container {
      position: relative;
      width: 100%;
      padding-top: 56.25%; /* 16:9 Format */
      overflow: hidden;
    }
    .iframe-container iframe {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      border: 0;
    }
  </style>
</head>
<body>

  <h2>Spiel auf meiner Seite</h2>
  
  <div class="iframe-container">
    <iframe 
      src="https://www.bitlife.school/" 
      allowfullscreen>
    </iframe>
  </div>

</body>
</html>
