<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meine Smarte KI</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #0f172a;
            color: #f8fafc;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 20px;
        }
        #chat-container {
            width: 100%;
            max-width: 480px;
            height: 580px;
            background: #1e293b;
            border-radius: 16px;
            display: flex;
            flex-direction: column;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
            border: 1px solid #334155;
            overflow: hidden;
        }
        .chat-header {
            background: #0f172a;
            padding: 15px 20px;
            border-bottom: 1px solid #334155;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        .chat-header-title {
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .chat-header h2 {
            font-size: 1.1rem;
            color: #38bdf8;
        }
        .status-dot {
            width: 10px;
            height: 10px;
            background: #22c55e;
            border-radius: 50%;
        }
        #chat-box {
            flex: 1;
            padding: 15px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        .message {
            max-width: 80%;
            padding: 10px 14px;
            border-radius: 12px;
            font-size: 0.95rem;
            line-height: 1.4;
            word-wrap: break-word;
        }
        .user {
            align-self: flex-end;
            background: #2563eb;
            color: white;
            border-bottom-right-radius: 2px;
        }
        .ai {
            align-self: flex-start;
            background: #334155;
            color: #f1f5f9;
            border-bottom-left-radius: 2px;
        }
        .input-group {
            display: flex;
            padding: 15px;
            background: #0f172a;
            gap: 8px;
            border-top: 1px solid #334155;
        }
        input {
            flex: 1;
            padding: 12px;
            background: #1e293b;
            border: 1px solid #475569;
            border-radius: 8px;
            color: white;
            font-size: 0.95rem;
            outline: none;
        }
        input:focus {
            border-color: #38bdf8;
        }
        button {
            padding: 12px 18px;
            background: #0284c7;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            transition: background 0.2s;
        }
        button:hover {
            background: #0369a1;
        }
    </style>
</head>
<body>

    <div id="chat-container">
        <div class="chat-header">
            <div class="chat-header-title">
                <div class="status-dot"></div>
                <h2>Meine KI (Smart-Mode)</h2>
            </div>
        </div>
        <div id="chat-box">
            <div class="message ai"><strong>KI:</strong> Hallo! Ich verstehe dich jetzt viel besser – sogar bei Tippfehlern. Schreib mir einfach etwas!</div>
        </div>
        <div class="input-group">
            <input type="text" id="user-input" placeholder="Schreib was du willst..." onkeypress="handleKeyPress(event)">
            <button onclick="sendMessage()">Senden</button>
        </div>
    </div>

    <script>
        const memory = {
            userName: null
        };

        // Algorithmus zur Berechnung der Ähnlichkeit von zwei Wörtern (Levenshtein-Distanz)
        function getSimilarity(a, b) {
            if (a.length === 0) return b.length;
            if (b.length === 0) return a.length;
            const matrix = [];
            for (let i = 0; i <= b.length; i++) matrix[i] = [i];
            for (let j = 0; j <= a.length; j++) matrix[0][j] = j;

            for (let i = 1; i <= b.length; i++) {
                for (let j = 1; j <= a.length; j++) {
                    if (b.charAt(i - 1) === a.charAt(j - 1)) {
                        matrix[i][j] = matrix[i - 1][j - 1];
                    } else {
                        matrix[i][j] = Math.min(
                            matrix[i - 1][j - 1] + 1,
                            matrix[i][j - 1] + 1,
                            matrix[i - 1][j] + 1
                        );
                    }
                }
            }
            const maxLength = Math.max(a.length, b.length);
            return 1 - matrix[b.length][a.length] / maxLength;
        }

        // Prüft, ob ein Wort im Text ähnlich zu den Ziel-Wörtern ist
        function checkKeywords(words, targetKeywords, threshold = 0.7) {
            for (let word of words) {
                // Ausrufezeichen, Fragezeichen etc. entfernen
                const cleanWord = word.replace(/[.,?!]/g, "");
                for (let target of targetKeywords) {
                    if (cleanWord === target || getSimilarity(cleanWord, target) >= threshold) {
                        return true;
                    }
                }
            }
            return false;
        }

        function appendMessage(sender, text, className) {
            const chatBox = document.getElementById("chat-box");
            const msgDiv = document.createElement("div");
            msgDiv.className = `message ${className}`;
            msgDiv.innerHTML = `<strong>${sender}:</strong> ${text}`;
            chatBox.appendChild(msgDiv);
            chatBox.scrollTop = chatBox.scrollHeight;
        }

        function getAIResponse(userInput) {
            const rawInput = userInput.trim();
            const lowerInput = rawInput.toLowerCase();
            const words = lowerInput.split(/\s+/);

            // 1. Namen merken / abfragen
            if (checkKeywords(words, ["hieße", "heisse", "name", "heiße"]) && (lowerInput.includes("ich") || lowerInput.includes("mein"))) {
                const nameMatch = rawInput.match(/(?:heiße|heisse|name ist|bin)\s+([A-Za-zÄöüÄÖÜß]+)/i);
                if (nameMatch && nameMatch[1]) {
                    memory.userName = nameMatch[1];
                    return `Freut mich sehr, ${memory.userName}! Ich hab mir deinen Namen gemerkt.`;
                }
            }

            if (checkKeywords(words, ["name", "heiße", "heisse"]) && checkKeywords(words, ["wie", "wer", "mein"])) {
                if (memory.userName) {
                    return `Du heißt ${memory.userName}!`;
                } else {
                    return "Du hast mir deinen Namen noch nicht verraten! Schreib z.B. 'Ich heiße Alex'.";
                }
            }

            // 2. Begrüßung
            if (checkKeywords(words, ["hallo", "hi", "hey", "servus", "moin", "guten tag"])) {
                const nameText = memory.userName ? ` ${memory.userName}` : "";
                return `Hey${nameText}! Schön, von dir zu hören. Worüber wollen wir sprechen?`;
            }

            // 3. Wie geht's
            if (checkKeywords(words, ["geht", "gehts", "befinden"]) || (checkKeywords(words, ["wie"]) && checkKeywords(words, ["du", "dir"]))) {
                return "Mir geht's super! Ich verarbeite gerade Daten und lerne dazu. Wie geht es dir?";
            }

            // 4. Uhrzeit & Datum
            if (checkKeywords(words, ["uhrzeit", "uhr", "zeit", "spät"])) {
                const now = new Date();
                return `Es ist jetzt genau ${now.toLocaleTimeString("de-DE", { hour: '2-digit', minute: '2-digit' })} Uhr.`;
            }

            if (checkKeywords(words, ["datum", "tag", "heute"])) {
                const now = new Date();
                return `Heute haben wir ${now.toLocaleDateString("de-DE", { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' })}.`;
            }

            // 5. Witze & Unterhaltung
            if (checkKeywords(words, ["witz", "witze", "lustig"])) {
                const witze = [
                    "Warum können Geister so schlecht lügen? Weil man durch sie hindurchsehen kann!",
                    "Was macht ein Pirat am Computer? Er drückt die Enter-Taste!",
                    "Treffen sich zwei Stifte. Sagt der eine: 'Mir reichts, ich gehe in den Ruhestand!'"
                ];
                return witze[Math.floor(Math.random() * witze.length)];
            }

            if (checkKeywords(words, ["münze", "kopf", "zahl", "werfen"])) {
                const res = Math.random() < 0.5 ? "Kopf" : "Zahl";
                return `Ich habe eine Münze geworfen: Es ist **${res}**!`;
            }

            // 6. Mathe-Rechner
            if (checkKeywords(words, ["rechne", "berechne", "mathe"]) || lowerInput.includes("+") || lowerInput.includes("-") || lowerInput.includes("*") || lowerInput.includes("/")) {
                const mathExpr = lowerInput.replace(/[^0-9\+\-\*\/\(\)\.]/g, "");
                if (mathExpr.length > 0) {
                    try {
                        const res = Function(`'use strict'; return (${mathExpr})`)();
                        return `Das Ergebnis ist: ${res}`;
                    } catch (e) {
                        // Kein gültiger Mathe-Ausdruck, weitergehen
                    }
                }
            }

            // 7. Wer bist du?
            if (checkKeywords(words, ["wer", "was"]) && checkKeywords(words, ["bist", "kannst", "machst"])) {
                return "Ich bin deine eigene KI! Ich kann mir Sachen merken, rechnen, dir Uhrzeit/Datum sagen, Witze erzählen und Tippfehler in deinen Fragen verstehen!";
            }

            // 8. Dynamischer Bot-Antwort-Generator für unbekannte Fragen (Raten)
            const fallbackAntworten = [
                `Du sprichst über "${rawInput}". Erzähl mir mehr darüber!`,
                `Gute Frage! Meinst du etwas Bestimmtes im Bereich ${words[0] || 'Thema'}?`,
                `Ich verstehe den Satz "${rawInput}" zwar noch nicht komplett, aber ich lerne ständig dazu!`,
                `Das klingt interessant! Kannst du mir das genauer erklären?`
            ];
            return fallbackAntworten[Math.floor(Math.random() * fallbackAntworten.length)];
        }

        function sendMessage() {
            const inputField = document.getElementById("user-input");
            const text = inputField.value.trim();
            if (text === "") return;

            appendMessage(memory.userName || "Du", text, "user");
            inputField.value = "";

            setTimeout(() => {
                const aiReply = getAIResponse(text);
                appendMessage("KI", aiReply, "ai");
            }, 300);
        }

        function handleKeyPress(event) {
            if (event.key === "Enter") {
                sendMessage();
            }
        }
    </script>
</body>
</html>
