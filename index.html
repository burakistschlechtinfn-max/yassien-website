<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meine Trainierbare KI</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #0f172a;
            color: #f8fafc;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 20px;
        }
        #chat-container {
            width: 100%;
            max-width: 500px;
            height: 650px;
            background: #1e293b;
            border-radius: 16px;
            display: flex;
            flex-direction: column;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
            border: 1px solid #334155;
            overflow: hidden;
        }
        .chat-header {
            background: #0f172a;
            padding: 15px 20px;
            border-bottom: 1px solid #334155;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        .chat-header-title {
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .chat-header h2 {
            font-size: 1.1rem;
            color: #38bdf8;
        }
        .status-dot {
            width: 10px;
            height: 10px;
            background: #22c55e;
            border-radius: 50%;
        }
        .knowledge-count {
            font-size: 0.8rem;
            color: #94a3b8;
        }
        #chat-box {
            flex: 1;
            padding: 15px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        .message {
            max-width: 85%;
            padding: 10px 14px;
            border-radius: 12px;
            font-size: 0.95rem;
            line-height: 1.4;
            word-wrap: break-word;
        }
        .user {
            align-self: flex-end;
            background: #2563eb;
            color: white;
            border-bottom-right-radius: 2px;
        }
        .ai {
            align-self: flex-start;
            background: #334155;
            color: #f1f5f9;
            border-bottom-left-radius: 2px;
        }
        .system-msg {
            align-self: center;
            background: #475569;
            color: #cbd5e1;
            font-size: 0.8rem;
            border-radius: 20px;
            padding: 4px 12px;
        }
        .img-preview {
            max-width: 100%;
            border-radius: 8px;
            margin-top: 8px;
        }
        .input-container {
            background: #0f172a;
            border-top: 1px solid #334155;
            padding: 12px;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        .input-group {
            display: flex;
            gap: 8px;
        }
        input[type="text"] {
            flex: 1;
            padding: 12px;
            background: #1e293b;
            border: 1px solid #475569;
            border-radius: 8px;
            color: white;
            font-size: 0.95rem;
            outline: none;
        }
        input[type="text"]:focus {
            border-color: #38bdf8;
        }
        button, label.file-btn {
            padding: 12px 16px;
            background: #0284c7;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            font-size: 0.9rem;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: background 0.2s;
        }
        button:hover, label.file-btn:hover {
            background: #0369a1;
        }
        input[type="file"] {
            display: none;
        }
        .tools-bar {
            display: flex;
            gap: 8px;
        }
        .tool-btn {
            background: #334155;
            font-size: 0.75rem;
            padding: 6px 10px;
        }
        .tool-btn:hover {
            background: #475569;
        }
    </style>
</head>
<body>

    <div id="chat-container">
        <div class="chat-header">
            <div class="chat-header-title">
                <div class="status-dot"></div>
                <h2>Smarte KI v2.0</h2>
            </div>
            <div class="knowledge-count" id="knowledge-count">Wissen: 0 Lektionen</div>
        </div>
        
        <div id="chat-box">
            <div class="message ai">
                <strong>KI:</strong> Hallo! Ich kann aus deinen Antworten lernen, Fotos verarbeiten und online nach Daten suchen.<br><br>
                💡 <em>Tipp:</em> Wenn ich etwas Falsches antworte, antworte mir mit: <code>lerne: [Frage] = [Antwort]</code>
            </div>
        </div>

        <div class="input-container">
            <div class="tools-bar">
                <label class="file-btn tool-btn">
                    📷 Bild laden
                    <input type="file" id="image-input" accept="image/*" onchange="handleImageUpload(event)">
                </label>
                <button class="tool-btn" onclick="resetBrain()">🧠 Wissen zurücksetzen</button>
            </div>
            <div class="input-group">
                <input type="text" id="user-input" placeholder="Schreibe eine Nachricht..." onkeypress="handleKeyPress(event)">
                <button onclick="sendMessage()">Senden</button>
            </div>
        </div>
    </div>

    <script>
        // Lokale Wissensdatenbank
        let customBrain = JSON.parse(localStorage.getItem("ai_brain")) || {};

        function updateKnowledgeCount() {
            const count = Object.keys(customBrain).length;
            document.getElementById("knowledge-count").innerText = `Wissen: ${count} Lektionen`;
        }
        updateKnowledgeCount();

        function saveBrain() {
            localStorage.setItem("ai_brain", JSON.stringify(customBrain));
            updateKnowledgeCount();
        }

        function resetBrain() {
            if (confirm("Möchtest du das gesamte gelernte Wissen der KI zurücksetzen?")) {
                customBrain = {};
                saveBrain();
                appendMessage("System", "Das Gedächtnis wurde zurückgesetzt.", "system-msg");
            }
        }

        function appendMessage(sender, text, className, isHTML = false) {
            const chatBox = document.getElementById("chat-box");
            const msgDiv = document.createElement("div");
            msgDiv.className = `message ${className}`;
            if (isHTML) {
                msgDiv.innerHTML = `<strong>${sender}:</strong> ${text}`;
            } else {
                msgDiv.innerText = `${sender}: ${text}`;
            }
            chatBox.appendChild(msgDiv);
            chatBox.scrollTop = chatBox.scrollHeight;
        }

        // Levenshtein-Distanz für unscharfe Wort-Übereinstimmung (Fuzzy Match)
        function getSimilarity(a, b) {
            if (a.length === 0) return b.length;
            if (b.length === 0) return a.length;
            const matrix = [];
            for (let i = 0; i <= b.length; i++) matrix[i] = [i];
            for (let j = 0; j <= a.length; j++) matrix[0][j] = j;

            for (let i = 1; i <= b.length; i++) {
                for (let j = 1; j <= a.length; j++) {
                    if (b.charAt(i - 1) === a.charAt(j - 1)) {
                        matrix[i][j] = matrix[i - 1][j - 1];
                    } else {
                        matrix[i][j] = Math.min(
                            matrix[i - 1][j - 1] + 1,
                            matrix[i][j - 1] + 1,
                            matrix[i - 1][j] + 1
                        );
                    }
                }
            }
            return 1 - matrix[b.length][a.length] / Math.max(a.length, b.length);
        }

        // Internet-Zugriff über Wikipedia API
        async function fetchWikipedia(query) {
            try {
                const url = `https://de.wikipedia.org/api/rest_v1/page/summary/${encodeURIComponent(query)}`;
                const response = await fetch(url);
                if (!response.ok) return null;
                const data = await response.json();
                return data.extract || null;
            } catch (e) {
                return null;
            }
        }

        async function getAIResponse(userInput) {
            const raw = userInput.trim();
            const lower = raw.toLowerCase();

            // 1. Manuelles Training (Syntax: "lerne: Frage = Antwort")
            if (lower.startsWith("lerne:")) {
                const content = raw.replace(/^lerne:/i, "").trim();
                const parts = content.split("=");
                if (parts.length === 2) {
                    const q = parts[0].trim().toLowerCase();
                    const a = parts[1].trim();
                    customBrain[q] = a;
                    saveBrain();
                    return `Danke! Ich habe gelernt: Wenn jemand "${q}" fragt, antworte ich: "${a}".`;
                } else {
                    return "Bitte nutze das Format: `lerne: Frage = Antwort`";
                }
            }

            // 2. Suche in gelernten Antworten (Gedächtnis)
            for (let key in customBrain) {
                if (getSimilarity(lower, key) > 0.75 || lower.includes(key)) {
                    return customBrain[key];
                }
            }

            // 3. Internet-Recherche (z. B. "suche: Berlin" oder "was ist [...]")
            if (lower.startsWith("suche ") || lower.startsWith("was ist ") || lower.startsWith("wer ist ")) {
                const topic = raw.replace(/^(suche|was ist|wer ist)\s+/i, "").replace("?", "").trim();
                appendMessage("KI", "🌐 Suche im Internet...", "ai");
                const wikiResult = await fetchWikipedia(topic);
                if (wikiResult) {
                    return `**Internet-Ergebnis (${topic}):**\n${wikiResult}`;
                }
            }

            // 4. Standard-Logik
            if (lower.includes("hallo") || lower.includes("hi")) return "Hallo! Wie kann ich dir heute helfen?";
            if (lower.includes("uhr")) return `Es ist ${new Date().toLocaleTimeString("de-DE", {hour:'2-digit', minute:'2-digit'})} Uhr.`;
            if (lower.includes("datum")) return `Heute ist der ${new Date().toLocaleDateString("de-DE")}.`;

            // 5. Unbekannte Frage -> Bietet Training an
            return `Das weiß ich noch nicht. Du kannst es mir aber beibringen!\nSchreib einfach:\n\`lerne: ${raw} = [Deine Antwort]\``;
        }

        async function sendMessage() {
            const inputField = document.getElementById("user-input");
            const text = inputField.value.trim();
            if (text === "") return;

            appendMessage("Du", text, "user");
            inputField.value = "";

            const aiReply = await getAIResponse(text);
            appendMessage("KI", aiReply, "ai", true);
        }

        function handleImageUpload(event) {
            const file = event.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function(e) {
                const imgUrl = e.target.result;
                appendMessage("Du", `Bild hochgeladen:<br><img src="${imgUrl}" class="img-preview">`, "user", true);

                setTimeout(() => {
                    appendMessage("KI", `Ich habe das Bild empfangen (${file.name}, ${Math.round(file.size / 1024)} KB). Du kannst mir beibringen, wie ich auf bestimmte Bilder reagieren soll!`, "ai");
                }, 500);
            };
            reader.readAsDataURL(file);
        }

        function handleKeyPress(event) {
            if (event.key === "Enter") sendMessage();
        }
    </script>
</body>
</html>
