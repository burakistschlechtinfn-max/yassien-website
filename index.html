<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BitLife Simulator</title>
  
  <link rel="stylesheet" href="https://fonts.googleapis.com/icon?family=Material+Icons">

  <style>
    * {
      box-sizing: border-box;
    }

    body, html {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: #121212;
      color: #ffffff;
    }

    /* Ladebildschirm Container */
    #loading-screen {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-color: #1e1e1e;
      z-index: 100;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      transition: opacity 0.5s ease;
    }

    .loading-content {
      text-align: center;
      max-width: 400px;
      width: 80%;
    }

    .loading-title {
      font-size: 32px;
      margin-bottom: 8px;
      font-weight: 600;
    }

    .loading-percentage {
      font-size: 18px;
      color: #a0a0a0;
      margin-bottom: 20px;
    }

    /* Fortschrittsbalken */
    .loader-bar {
      width: 100%;
      height: 6px;
      background-color: rgba(255, 255, 255, 0.1);
      border-radius: 3px;
      overflow: hidden;
      position: relative;
    }

    .loader-progress {
      position: absolute;
      top: 0;
      left: 0;
      height: 100%;
      width: 0%;
      background-color: #007bff;
      border-radius: 3px;
      animation: progress-animation 1.5s ease-in-out infinite;
    }

    @keyframes progress-animation {
      0% { width: 0%; left: 0; }
      50% { width: 100%; left: 0; }
      100% { width: 0%; left: 100%; }
    }

    /* Steuerungs-Menü unten links */
    #menu {
      position: fixed;
      bottom: 15px;
      left: 15px;
      background-color: rgba(30, 30, 30, 0.75);
      backdrop-filter: blur(5px);
      border-radius: 10px;
      padding: 5px;
      display: flex;
      gap: 10px;
      z-index: 10;
      box-shadow: 0 4px 6px rgba(0, 0, 0, 0.3);
    }

    .menu-button {
      color: #e0e0e0;
      cursor: pointer;
      padding: 8px;
      border-radius: 6px;
      transition: background-color 0.2s, color 0.2s;
      user-select: none;
    }

    .menu-button:hover {
      background-color: rgba(255, 255, 255, 0.1);
      color: #ffffff;
    }

    /* Game Frame */
    #game-frame {
      width: 100%;
      height: 100%;
      border: none;
      display: block;
    }
  </style>
</head>
<body>

  <!-- Ladebildschirm -->
  <div id="loading-screen">
    <div class="loading-content">
      <div class="loading-title">BitLife</div>
      <div id="loading-percentage" class="loading-percentage">0%</div>
      <div class="loader-bar">
        <div class="loader-progress"></div>
      </div>
    </div>
  </div>

  <!-- Spiel-Einbindung -->
  <iframe id="game-frame" src="https://sz-games.github.io/Games9/bitlife" allowfullscreen></iframe>

  <!-- Steuerungselemente -->
  <div id="menu">
    <span class="material-icons menu-button" title="Seite neu laden" onclick="location.reload();">refresh</span>
    <span class="material-icons menu-button" title="Vollbild" onclick="toggleFullScreen();">fullscreen</span>
  </div>

  <script>
    // Ladeanzeige-Logik
    window.addEventListener('DOMContentLoaded', function() {
      const totalResources = document.getElementsByTagName('*').length;
      let loadedResources = 0;
      const percentageElement = document.getElementById('loading-percentage');

      function updateProgress() {
        loadedResources++;
        const percentage = Math.min(Math.round((loadedResources / totalResources) * 100), 100);
        percentageElement.textContent = percentage + '%';
      }

      const elements = document.getElementsByTagName('*');
      for (let i = 0; i < elements.length; i++) {
        elements[i].addEventListener('load', updateProgress);
        elements[i].addEventListener('error', updateProgress);
      }
    });

    // Ladebildschirm ausblenden, sobald alles geladen ist
    window.addEventListener('load', function() {
      const loadingScreen = document.getElementById('loading-screen');
      document.getElementById('loading-percentage').textContent = '100%';
      
      loadingScreen.style.opacity = '0';
      setTimeout(() => {
        loadingScreen.style.display = 'none';
      }, 500);
    });

    // Vollbild-Funktionsaufruf
    function toggleFullScreen() {
      const elem = document.getElementById('game-frame');
      if (!document.fullscreenElement) {
        if (elem.requestFullscreen) {
          elem.requestFullscreen();
        } else if (elem.webkitRequestFullscreen) { /* Safari */
          elem.webkitRequestFullscreen();
        } else if (elem.msRequestFullscreen) { /* IE11 */
          elem.msRequestFullscreen();
        }
      } else {
        if (document.exitFullscreen) {
          document.exitFullscreen();
        }
      }
    }
  </script>

</body>
</html>
